<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101010" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <title>Octopus</title>
    <style>
      /* Establish the cascade before dependency CSS, including lazy surfaces. */
      @layer octopus-foundation, properties, theme, base, components, utilities;

      :root {
        --startup-background: transparent;
        --startup-logo-shimmer-peak: rgb(255 255 255 / 48%);
        --startup-logo-shimmer-soft: rgb(255 255 255 / 4%);
        --startup-logo-shimmer-tail: rgb(255 255 255 / 8%);
      }

      html,
      body,
      #root {
        width: 100%;
        height: 100%;
      }

      html,
      body {
        margin: 0;
        background: var(--startup-background);
      }

      .startup-loader {
        display: flex;
        width: 100%;
        height: 100%;
        align-items: center;
        justify-content: center;
        background: var(--startup-background);
        -webkit-app-region: drag;
      }

      .startup-loader__logo {
        position: relative;
        width: 56px;
        height: 56px;
        opacity: 0;
        animation: startup-octopus-fade-in 180ms ease-out 60ms forwards;
      }

      .startup-loader__base,
      .startup-loader__overlay {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      .startup-loader__base {
        object-fit: contain;
        opacity: 0.68;
      }

      .startup-loader__overlay {
        -webkit-mask-image: url("./octopus-logo.png");
        -webkit-mask-position: center;
        -webkit-mask-repeat: no-repeat;
        -webkit-mask-size: contain;
        mask-image: url("./octopus-logo.png");
        mask-position: center;
        mask-repeat: no-repeat;
        mask-size: contain;
      }

      :root.electron-light .startup-loader__base {
        filter: brightness(0);
        opacity: 0.24;
      }

      .startup-loader__overlay {
        background-image: linear-gradient(
          112deg,
          transparent 22%,
          var(--startup-logo-shimmer-soft) 38%,
          var(--startup-logo-shimmer-peak) 49%,
          var(--startup-logo-shimmer-tail) 56%,
          transparent 74%
        );
        background-position: 140% 0;
        background-repeat: no-repeat;
        background-size: 220% 100%;
        animation: startup-octopus-shimmer 2200ms cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        .startup-loader__logo {
          animation: none;
          opacity: 1;
        }

        .startup-loader__overlay {
          animation: none;
        }
      }

      @keyframes startup-octopus-fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      @keyframes startup-octopus-shimmer {
        from { background-position: 140% 0; }
        to { background-position: -105% 0; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div aria-hidden="true" class="startup-loader">
        <div class="startup-loader__logo">
          <img alt="" class="startup-loader__base" src="./octopus-logo.png" />
          <div class="startup-loader__overlay"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
