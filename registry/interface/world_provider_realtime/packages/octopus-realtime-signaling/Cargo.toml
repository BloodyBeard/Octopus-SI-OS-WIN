[package]
name = "octopus-realtime-signaling"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "octopus_realtime_signaling"
path = "src/lib.rs"
doctest = false

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = "0.1.44"
reqwest = { version = "0.12", features = ["json"] }
blake3 = { workspace = true }
futures-util = "0.3"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-native-certs = "0.8"
octopus-login = { path = "../../../world_provider_codex/packages/octopus-codex-login" }
octopus-run-authoring = { path = "../../../system_interface_authoring/packages/octopus-run-authoring" }

octopus-descriptors = { path = "../../../../../crates/octopus-descriptors" }
octopus-policy = { path = "../../../../../crates/octopus-policy" }
octopus-ledger = { path = "../../../../../crates/octopus-ledger" }
octopus-interface-transport = { path = "../../../../../crates/octopus-interface-transport" }
octopus-world-pyecho-life-runtime = { path = "../../../world_pyecho/packages/octopus-world-pyecho-life-runtime" }
octopus-interfaces = { path = "../../../../../crates/octopus-interfaces" }

[dev-dependencies]
octopus-tool-handlers = { path = "../../../../../crates/octopus-tool-handlers" }
octopus-system-room-env = { path = "../../../../worker_environment_kind/system_room/packages/octopus-system-room-env" }
octopus-ledger-index = { path = "../../../../../crates/octopus-ledger-index" }
octopus-ledger-store = { path = "../../../../../crates/octopus-ledger-store" }
json-patch = { workspace = true }
octopus-app-server-interface = { path = "../../../world_operator_chat/packages/octopus-app-server-interface" }
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net"] }
tokio-util = { workspace = true }
