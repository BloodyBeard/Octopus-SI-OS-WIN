[package]
name = "octopus-interface-activation-stdin-json-lines"
edition = "2024"
version.workspace = true
license.workspace = true
rust-version = "1.85"

[lib]
name = "octopus_interface_activation_stdin_json_lines"
path = "src/lib.rs"
doctest = false

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "io-std", "io-util"] }
tracing = "0.1.44"
octopus-descriptors = { path = "../../../../../crates/octopus-descriptors" }
octopus-interfaces = { path = "../../../../../crates/octopus-interfaces" }
octopus-interface-transport = { path = "../../../../../crates/octopus-interface-transport" }
octopus-world-pyecho-life-runtime = { path = "../octopus-world-pyecho-life-runtime" }
