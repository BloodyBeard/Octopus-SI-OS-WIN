[package]
name = "octopus-world-provider-gemini"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
doctest = false
name = "octopus_world_provider_gemini"
path = "src/lib.rs"

[[bin]]
name = "octopus-world-provider-gemini-life"
path = "src/bin/life.rs"

[dependencies]
base64 = "0.22"
blake3 = "1"
jsonwebtoken = "9.3.1"
reqwest = { version = "0.12", features = ["json"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio.workspace = true

octopus-descriptors = { path = "../../../../../crates/octopus-descriptors" }
octopus-interface-transport = { path = "../../../../../crates/octopus-interface-transport" }
octopus-world-pyecho-life-runtime = { path = "../../../world_pyecho/packages/octopus-world-pyecho-life-runtime" }
octopus-interfaces = { path = "../../../../../crates/octopus-interfaces" }
octopus-ledger = { path = "../../../../../crates/octopus-ledger" }
octopus-ledger-store = { path = "../../../../../crates/octopus-ledger-store" }
octopus-secrets = { path = "../../../world_provider_codex/packages/octopus-secrets" }
octopus-model-context-render = { path = "../../../world_provider_codex/packages/octopus-model-context-render" }
octopus-provider-run-authoring = { path = "../../../world_provider_ollama/packages/octopus-provider-run-authoring" }
octopus-tool-handlers = { path = "../../../../../crates/octopus-tool-handlers" }

[dev-dependencies]
tempfile = "3.23.0"
octopus-runtime = { path = "../../../../../crates/octopus-runtime" }
