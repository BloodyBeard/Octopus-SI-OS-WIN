[package]
name = "octopus-world-terminal-config"
# Same edition-2024 idioms as the sibling world_terminal render/client/keymap libs.
# The workspace root pins edition = "2021"; override per-crate.
edition = "2024"
version.workspace = true
license.workspace = true
rust-version = "1.85"

[lib]
name = "octopus_world_terminal_config"
path = "src/lib.rs"
doctest = false

# ─────────────────────────────────────────────────────────────────────────────
# THE world_terminal INTERFACE'S PRIVATE `[tui]` CONFIG SURFACE (the config
# divorce — docs/ai/codex-cut-map.md §2.2 / §9.13-residual / §9.28(5)).
#
# One config.toml FILE serves two owners; each owner parses ONLY its own
# section, fail-closed. This crate is the TERMINAL owner: the on-disk `[tui]`
# section schema (status line, terminal title, theme, pet, notifications,
# animations, alt-screen, vim default, raw output, resize-reflow, model
# availability NUX, keymap via the sibling keymap lib), the resolved
# `TerminalConfig` the terminal runtime reads, and the WRITE surface (the
# `/settings`-style edits) that persists `[tui].*` keys back into the same
# file with toml_edit, preserving the rest of the document byte-for-byte.
#
# The provider (octopus-codex-config / octopus-codex-core) no longer types the
# `[tui]` section — its ConfigToml carries the table as an OPAQUE value so
# strict-config keeps accepting the file, and its Config struct carries zero
# tui_* fields. Reading rides the SAME merged layer stack the provider
# computes: the terminal deserializes its section from the effective merged
# TOML value (so `-c tui.theme=…` CLI overrides and layered config keep
# working exactly as before); the merged value and the write-target path are
# handed in as PLAIN DATA (a `toml::Value` + a `PathBuf`), never as provider
# types.
#
# MODEL-BLIND BY CONSTRUCTION: like the render/client/keymap libs, ZERO
# octopus-protocol / provider / model / app-server dependency. schemars +
# serde + toml/toml_edit + the interface-owned path helpers + the
# sibling keymap schema. Nothing here knows about the model turn-loop.
# ─────────────────────────────────────────────────────────────────────────────
[dependencies]
anyhow = { workspace = true }
schemars = "0.8.22"
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["rt"] }
toml = "0.9.5"
toml_edit = "0.24.0"
octopus-utils-path = { path = "../octopus-utils-path" }
octopus-world-terminal-keymap = { path = "../octopus-world-terminal-keymap" }

[dev-dependencies]
pretty_assertions = "1.4.1"
tempfile = "3.23.0"
tokio = { workspace = true, features = ["macros", "rt"] }
