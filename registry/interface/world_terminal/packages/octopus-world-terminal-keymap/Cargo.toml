[package]
name = "octopus-world-terminal-keymap"
edition = "2024"
version.workspace = true
license.workspace = true
rust-version = "1.85"

[lib]
name = "octopus_world_terminal_keymap"
path = "src/lib.rs"
doctest = false
[dependencies]
schemars = "0.8.22"
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
pretty_assertions = "1.4.1"
toml = { version = "0.9.5", features = ["preserve_order"] }
