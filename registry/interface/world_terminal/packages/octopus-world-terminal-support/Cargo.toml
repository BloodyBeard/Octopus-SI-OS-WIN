[package]
name = "octopus-world-terminal-support"
version.workspace = true
edition = "2024"
license.workspace = true
rust-version = "1.85"

[lib]
name = "octopus_world_terminal_support"
path = "src/lib.rs"
doctest = false

[dependencies]
regex-lite = "0.1.8"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2 = "0.10"
tempfile = "3.23.0"
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }
tracing-subscriber = "0.3.22"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.23.0"
