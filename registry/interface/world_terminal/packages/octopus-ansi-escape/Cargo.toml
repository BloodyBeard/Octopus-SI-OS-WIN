[package]
name = "octopus-ansi-escape"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "octopus_ansi_escape"
path = "src/lib.rs"
test = false
doctest = false

[dependencies]
# --- crates.io (explicit versions + features copied from codex workspace) ---
ansi-to-tui = "7.0.0"
# NOTE: codex patches crates-io to the nornagon ratatui fork via a workspace-root
# [patch.crates-io]. That patch table is only legal at the workspace root, which
# this port may not edit. We pin the equivalent crates-io version (the unstable
# feature flags below also exist on 0.29.0), matching sibling octopus-tui. The
# conductor should add the [patch.crates-io] fork to the root Cargo.toml.
ratatui = { version = "0.29.0", features = [
    "unstable-rendered-line-info",
    "unstable-widget-ref",
] }
tracing = { version = "0.1.44", features = ["log"] }
