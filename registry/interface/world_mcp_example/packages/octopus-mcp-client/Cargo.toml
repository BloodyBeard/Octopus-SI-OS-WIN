[package]
name = "octopus-mcp-client"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
blake3.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = "0.1.44"
reqwest = { version = "0.12", features = ["json"] }
thiserror.workspace = true
libc = "0.2.182"
jsonschema = { version = "0.33.0", default-features = false }

octopus-descriptors = { path = "../../../../../crates/octopus-descriptors" }
octopus-interface-transport = { path = "../../../../../crates/octopus-interface-transport" }
octopus-world-pyecho-life-runtime = { path = "../../../world_pyecho/packages/octopus-world-pyecho-life-runtime" }
octopus-interfaces = { path = "../../../../../crates/octopus-interfaces" }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net"] }
octopus-ledger = { path = "../../../../../crates/octopus-ledger" }
