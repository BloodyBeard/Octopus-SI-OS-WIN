[package]
name = "octopus-cxapi"
# Ported Codex source uses edition 2024 idioms (let-chains); override workspace.
edition = "2024"
version.workspace = true
license.workspace = true
rust-version = "1.85"

[dependencies]
octopus-client = { path = "../octopus-client" }
octopus-protocol = { path = "../octopus-protocol" }

serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["fs", "macros", "net", "rt", "sync", "time"] }
tokio-util = { version = "0.7.18", features = ["codec", "io"] }

async-channel = "2.3.1"
base64 = "0.22.1"
bytes = "1.10.1"
chrono = "0.4.43"
eventsource-stream = "0.2.3"
futures = { version = "0.3", default-features = false }
http = "1.3.1"
regex-lite = "0.1.8"
reqwest = { version = "0.12", features = ["json", "stream", "cookies"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
schemars = "0.8.22"
# NOTE: codex pinned the openai-oss-forks tungstenite/tokio-tungstenite (fork-only
# `proxy`/`deflate` features + permessage-deflate). We do not depend on those forks;
# we use the stock crates.io releases. `tungstenite` is pinned to 0.28 to match the
# version re-exported by `tokio-tungstenite` 0.28 so `WebSocketConfig` is one type.
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-native-roots"] }
tracing = "0.1.44"
tungstenite = { version = "0.28.0" }
url = "2"

[dev-dependencies]
anyhow.workspace = true
assert_matches = "1.5.0"
pretty_assertions = "1.4.1"
tokio-test = "0.4"
wiremock = "0.6"

[lib]
doctest = false
