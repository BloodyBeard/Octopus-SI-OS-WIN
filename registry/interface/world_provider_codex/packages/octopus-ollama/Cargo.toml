[package]
name = "octopus-ollama"
# Ported Codex source uses let-chains, which require the 2024 edition (matches the
# other ported siblings, e.g. octopus-core/octopus-mcp). Override the workspace
# 2021 pin locally so the ported source compiles.
edition = "2024"
version.workspace = true
license.workspace = true
# edition 2024 requires rust-version >= 1.85; workspace pins lower, so override.
rust-version = "1.85"

[lib]
name = "octopus_ollama"
path = "src/lib.rs"
doctest = false

[dependencies]
async-stream = "0.3.6"
bytes = "1.10.1"
futures = { version = "0.3", default-features = false }
memchr = "2.7.6"
reqwest = { version = "0.12", features = ["json", "stream", "cookies"] }
semver = "1.0"
tracing = { version = "0.1.44", features = ["log"] }
wiremock = "0.6"

octopus-core = { path = "../octopus-codex-core" }
octopus-codex-model-provider-info = { path = "../octopus-codex-model-provider-info" }

serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
blake3.workspace = true
tokio = { workspace = true, features = [
    "io-std",
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
] }
tokio-util.workspace = true

[dev-dependencies]
assert_matches = "1.5.0"
pretty_assertions = "1.4.1"
