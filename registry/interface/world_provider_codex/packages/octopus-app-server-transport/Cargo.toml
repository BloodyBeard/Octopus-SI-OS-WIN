[package]
name = "octopus-app-server-transport"
# Codex source is edition 2024 (uses let-chains); workspace default is 2021.
# Match the other ported codex crates (octopus-exec, octopus-appserver-proto, ...).
edition = "2024"
version.workspace = true
license.workspace = true
rust-version = "1.85"

[lib]
name = "octopus_app_server_transport"
path = "src/lib.rs"
doctest = false

[features]
default = []

[dependencies]
octopus-local-socket = { path = "../../../../../crates/octopus-local-socket" }
# workspace primitives (kept as workspace deps)
anyhow.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
octopus-utils-home-dir = { path = "../../../../../registry/interface/world_terminal/packages/octopus-utils-home-dir" }
tokio = { workspace = true, features = [
    "fs",
    "io-std",
    "io-util",
    "macros",
    "net",
    "rt",
    "rt-multi-thread",
] }
tokio-util = { workspace = true, features = ["compat"] }

# crates.io deps (explicit versions + features from codex workspace.dependencies)
axum = { version = "0.8", default-features = false, features = [
    "http1",
    "json",
    "tokio",
    "ws",
] }
base64 = "0.22.1"
clap = { version = "4", features = ["derive"] }
constant_time_eq = "0.3.1"
futures = { version = "0.3", default-features = false }
gethostname = "1.1.0"
hmac = "0.12.1"
# used by the inlined `auth_provider_from_auth` (src/transport/remote_control/auth.rs)
http = "1.3.1"
jsonwebtoken = "9.3.1"
owo-colors = { version = "4.3.0", features = ["supports-colors"] }
sha2 = "0.10"
time = "0.3.47"
# codex used a git fork for the `proxy` feature; crates.io 0.28.0 lacks it and
# the source never references proxy support, so we drop it and keep the
# connect/handshake + native-roots rustls surface the transport actually uses.
tokio-tungstenite = { version = "0.28.0", features = [
    "connect",
    "handshake",
    "rustls-tls-native-roots",
] }
tracing = { version = "0.1.44", features = ["log"] }
url = "2"
uuid = { version = "1", features = ["serde", "v7"] }

# TODO(consolidate): `find_codex_home` + `backoff` live in src/home_dir.rs until
# a small shared home-dir/backoff utility crate exists. Durable Octopus truth
# belongs in the movement ledger, not in transport-local persistence.
dirs = "6"
rand = "0.9"

rustls = { version = "0.23", default-features = false, features = [
    "aws_lc_rs",
    "std",
] }

octopus-cxapi = { path = "../octopus-cxapi" }
octopus-appserver-proto = { path = "../octopus-appserver-proto" }
octopus-identity = { path = "../octopus-codex-identity" }
octopus-login = { path = "../octopus-codex-login" }
octopus-util-abspath = { path = "../../../../worker_environment_kind/process_session/packages/octopus-util-abspath" }

[dev-dependencies]
chrono = "0.4.43"
octopus-config = { path = "../octopus-codex-config" }
pretty_assertions = "1.4.1"
tempfile = "3.23.0"
