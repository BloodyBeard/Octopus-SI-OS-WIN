[package]
name = "octopus-otel"
# Ported Codex source uses edition 2024 idioms (let-chains); siblings (protocol/cxapi/appserver-proto) are 2024.
edition = "2024"
version.workspace = true
license.workspace = true
rust-version = "1.85"

[lib]
doctest = false
name = "octopus_otel"
path = "src/lib.rs"

[dependencies]
# workspace primitives (kept as name.workspace = true per port rule)
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

# ported siblings (codex-* -> octopus-*)
octopus-util-abspath = { path = "../../../../worker_environment_kind/process_session/packages/octopus-util-abspath" }
octopus-util-string = { path = "../octopus-util-string" }
octopus-cxapi = { path = "../octopus-cxapi" }
octopus-protocol = { path = "../octopus-protocol" }

# crates.io deps (versions/features mirrored from docs/references/codex/codex-rs/Cargo.toml + otel/Cargo.toml)
chrono = "0.4.43"
eventsource-stream = "0.2.3"
gethostname = "1.1.0"
http = "1.3.1"
opentelemetry = { version = "0.31.0", features = ["logs", "metrics", "trace"] }
opentelemetry-appender-tracing = "0.31.0"
opentelemetry-otlp = { version = "0.31.0", features = [
    "grpc-tonic",
    "http-proto",
    "http-json",
    "logs",
    "metrics",
    "trace",
    "reqwest-blocking-client",
    "reqwest-rustls",
    "tls",
    "tls-roots",
] }
opentelemetry-semantic-conventions = "0.31.0"
opentelemetry_sdk = { version = "0.31.0", features = [
    "experimental_trace_batch_span_processor_with_async_runtime",
    "experimental_metrics_custom_reader",
    "logs",
    "metrics",
    "rt-tokio",
    "testing",
    "trace",
] }
os_info = "3.12.0"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"] }
strum_macros = "0.28.0"
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
tracing-opentelemetry = "0.32.0"
tracing-subscriber = "0.3.22"

[dev-dependencies]
opentelemetry_sdk = { version = "0.31.0", features = [
    "experimental_metrics_custom_reader",
    "testing",
] }
pretty_assertions = "1.4.1"
