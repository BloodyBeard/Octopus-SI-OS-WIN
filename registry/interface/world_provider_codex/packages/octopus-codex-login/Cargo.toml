[package]
name = "octopus-login"
# Ported Codex source uses let-chains -> requires edition 2024 (override workspace 2021).
edition = "2024"
rust-version = "1.85"
version.workspace = true
license.workspace = true

[dependencies]
# crates.io deps (explicit versions + features copied from codex workspace)
base64 = "0.22.1"
chrono = { version = "0.4.43", features = ["serde"] }
once_cell = "1.20.2"
os_info = "3.12.0"
rand = "0.9"
reqwest = { version = "0.12", features = ["json", "blocking", "cookies"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tiny_http = "0.12"
tracing = "0.1.44"
url = "2"
urlencoding = "2.1"
webbrowser = "1.0"

# workspace-pinned primitives
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = [
    "io-std",
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
] }

# ported octopus siblings (codex-* -> octopus-*)
octopus-identity = { path = "../octopus-codex-identity" }
octopus-appserver-proto = { path = "../octopus-appserver-proto" }
octopus-client = { path = "../octopus-client" }
octopus-config = { path = "../octopus-codex-config" }
octopus-secrets = { path = "../octopus-secrets" }
octopus-codex-model-provider-info = { path = "../octopus-codex-model-provider-info" }
octopus-otel = { path = "../octopus-otel" }
octopus-protocol = { path = "../octopus-protocol" }

[dev-dependencies]
anyhow.workspace = true
jsonwebtoken = "9.3.1"
keyring = { version = "3.6", default-features = false }
pretty_assertions = "1.4.1"
regex-lite = "0.1.8"
serial_test = "3.2.0"
tempfile = "3.23.0"
wiremock = "0.6"
octopus-secrets = { path = "../octopus-secrets", features = ["test-support"] }

[lib]
doctest = false
