[package]
name = "octopus-install-context"
# Codex source is edition 2024 (let-chains); the workspace default is 2021, so
# pin 2024 explicitly here as sibling ported crates do.
edition = "2024"
version.workspace = true
license.workspace = true
# edition 2024 requires rustc >= 1.85 (override workspace 1.80).
rust-version = "1.85"

[lib]
name = "octopus_install_context"
path = "src/lib.rs"
doctest = false

[dependencies]
# Ported sibling: utils/absolute-path -> octopus-util-abspath (RENAME EXCEPTION).
octopus-util-abspath = { path = "../../../../worker_environment_kind/process_session/packages/octopus-util-abspath" }
# crates.io dep (version + feature parity with codex-rs workspace deps). Used by
# the inlined home_dir module that replaces the un-ported codex-utils-home-dir.
dirs = "6"

[dev-dependencies]
pretty_assertions = "1.4.1"
tempfile = "3.23.0"
