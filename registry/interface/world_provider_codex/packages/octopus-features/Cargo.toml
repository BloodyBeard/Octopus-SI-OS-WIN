[package]
name = "octopus-features"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
doctest = false
name = "octopus_features"
path = "src/lib.rs"

[dependencies]
# Canonical SessionTelemetry lives in octopus-otel; re-exported via src/telemetry.rs.
octopus-otel = { path = "../octopus-otel" }
octopus-protocol = { path = "../octopus-protocol" }
# The spine master primitive: features become content-addressed descriptors loaded
# fail-closed through the DescriptorStore (re-rooting seam config-features-to-descriptors).
octopus-descriptors = { path = "../../../../../crates/octopus-descriptors" }
schemars = "0.8.22"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
toml = "0.9.5"
tracing = { version = "0.1.44", features = ["log"] }

[dev-dependencies]
pretty_assertions = "1.4.1"
