[package]
name = "octopus-codex-sandbox-launcher"
edition = "2024"
version.workspace = true
license.workspace = true
rust-version = "1.85"

[lib]
name = "octopus_sandbox_launcher"
path = "src/lib.rs"
doctest = false

[dependencies]
anyhow.workspace = true
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
regex-lite = "0.1.8"
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "process", "rt-multi-thread", "io-util", "signal", "time"] }
toml = "0.9.5"
tracing = "0.1.44"

octopus-sandbox = { package = "octopus-sandbox-substrate", path = "../../../../../registry/worker_environment_kind/process_session/packages/octopus-sandbox-substrate" }
octopus-config = { path = "../octopus-codex-config" }
octopus-core = { path = "../octopus-codex-core" }
octopus-protocol = { path = "../octopus-protocol" }
octopus-utils-cli = { path = "../../../../../registry/interface/world_terminal/packages/octopus-utils-cli" }
octopus-util-abspath = { path = "../../../../worker_environment_kind/process_session/packages/octopus-util-abspath" }

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3.23.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2.182"

[target.'cfg(windows)'.dependencies]
octopus-windows-sandbox = { path = "../../../../../crates/octopus-windows-sandbox" }
