[package]
name = "octopus-interface-activation-http-json-poll"
edition = "2024"
version.workspace = true
license.workspace = true
rust-version = "1.85"

[lib]
name = "octopus_interface_activation_http_json_poll"
path = "src/lib.rs"
doctest = false

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing = "0.1.44"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
octopus-descriptors = { path = "../../../../../crates/octopus-descriptors" }
octopus-interface-transport = { path = "../../../../../crates/octopus-interface-transport" }
octopus-world-pyecho-life-runtime = { path = "../../../world_pyecho/packages/octopus-world-pyecho-life-runtime" }
octopus-interfaces = { path = "../../../../../crates/octopus-interfaces" }
octopus-secrets = { path = "../../../world_provider_codex/packages/octopus-secrets" }
