[package]
name = "octopus-world-provider-github-copilot-acp"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
doctest = false
name = "octopus_world_provider_github_copilot_acp"
path = "src/lib.rs"

[[bin]]
name = "octopus-world-provider-github-copilot-acp-life"
path = "src/bin/life.rs"

[dependencies]
blake3 = "1"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio.workspace = true

octopus-descriptors = { path = "../../../../../crates/octopus-descriptors" }
octopus-github-copilot-auth = { path = "../../../world_provider_github_copilot/packages/octopus-github-copilot-auth" }
octopus-interface-transport = { path = "../../../../../crates/octopus-interface-transport" }
octopus-world-pyecho-life-runtime = { path = "../../../world_pyecho/packages/octopus-world-pyecho-life-runtime" }
octopus-interfaces = { path = "../../../../../crates/octopus-interfaces" }
octopus-model-context-render = { path = "../../../world_provider_codex/packages/octopus-model-context-render" }
octopus-provider-run-authoring = { path = "../../../world_provider_ollama/packages/octopus-provider-run-authoring" }

[dev-dependencies]
tempfile = "3.23.0"
