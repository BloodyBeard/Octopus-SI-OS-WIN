[package]
name = "octopus-operator-chat-client"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "octopus-operator-chat-topology"
path = "src/bin/octopus-operator-chat-topology.rs"

[[bin]]
name = "octopus-operator-chat-artifact"
path = "src/bin/octopus-operator-chat-artifact.rs"

[dependencies]
blake3.workspace = true
octopus-app-server = { path = "../../../../../crates/octopus-app-server" }
octopus-context-collections = { path = "../../../system_context/packages/octopus-context-collections" }
octopus-descriptors = { path = "../../../../../crates/octopus-descriptors" }
octopus-ee = { path = "../../../../../crates/octopus-ee" }
octopus-interface-transport = { path = "../../../../../crates/octopus-interface-transport" }
octopus-interfaces = { path = "../../../../../crates/octopus-interfaces" }
octopus-ledger = { path = "../../../../../crates/octopus-ledger" }
octopus-marks = { path = "../../../../../crates/octopus-marks" }
octopus-policy = { path = "../../../../../crates/octopus-policy" }
octopus-provider-run-authoring = { path = "../../../world_provider_ollama/packages/octopus-provider-run-authoring" }
octopus-process-session-tool-runtime = { path = "../../../../worker_environment_kind/process_session/packages/octopus-process-session-tool-runtime" }
octopus-runtime = { path = "../../../../../crates/octopus-runtime" }
octopus-tool-registry = { path = "../../../../../crates/octopus-tool-registry" }
octopus-verifiers = { path = "../../../../../crates/octopus-verifiers" }
octopus-worker-env = { path = "../../../../../crates/octopus-worker-env" }
octopus-world-terminal-client = { path = "../../../world_terminal/packages/octopus-world-terminal-client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
futures = "0.3"
tokio-tungstenite = "0.28.0"
octopus-system-room-env = { path = "../../../../worker_environment_kind/system_room/packages/octopus-system-room-env" }
octopus-tool-handlers = { path = "../../../../../crates/octopus-tool-handlers" }
octopus-world-pyecho-life-runtime = { path = "../../../world_pyecho/packages/octopus-world-pyecho-life-runtime" }
octopus-app-server-interface = { path = "../octopus-app-server-interface" }
tokio = { version = "1", features = ["macros", "rt"] }
octopus-ledger-store = { path = "../../../../../crates/octopus-ledger-store" }
tempfile = "3"
