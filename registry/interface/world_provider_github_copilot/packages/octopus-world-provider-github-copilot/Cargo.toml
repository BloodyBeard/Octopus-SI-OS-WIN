[package]
name = "octopus-world-provider-github-copilot"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
doctest = false
name = "octopus_world_provider_github_copilot"
path = "src/lib.rs"

[[bin]]
name = "octopus-world-provider-github-copilot-life"
path = "src/bin/life.rs"

[[bin]]
name = "octopus-world-provider-github-copilot-anthropic-life"
path = "src/bin/anthropic_life.rs"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio.workspace = true

octopus-descriptors = { path = "../../../../../crates/octopus-descriptors" }
octopus-github-copilot-auth = { path = "../octopus-github-copilot-auth" }
octopus-interface-transport = { path = "../../../../../crates/octopus-interface-transport" }
octopus-world-pyecho-life-runtime = { path = "../../../world_pyecho/packages/octopus-world-pyecho-life-runtime" }
octopus-interfaces = { path = "../../../../../crates/octopus-interfaces" }
octopus-ledger = { path = "../../../../../crates/octopus-ledger" }
octopus-ledger-store = { path = "../../../../../crates/octopus-ledger-store" }
octopus-provider-run-authoring = { path = "../../../world_provider_ollama/packages/octopus-provider-run-authoring" }
octopus-world-provider-anthropic = { path = "../../../world_provider_anthropic/packages/octopus-world-provider-anthropic" }
octopus-world-provider-responses = { path = "../../../world_provider_responses/packages/octopus-world-provider-responses" }

[dev-dependencies]
tempfile = "3.23.0"
