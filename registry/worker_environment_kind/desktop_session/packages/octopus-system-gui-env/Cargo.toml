[package]
name = "octopus-system-gui-env"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "octopus_system_gui_env"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net"] }
base64 = "0.22"
sha2 = "0.10"
libc = "0.2"
getrandom = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
reqwest = { version = "0.12", features = ["json"] }
url = "2"
blake3.workspace = true

octopus-descriptors = { path = "../../../../../crates/octopus-descriptors" }
octopus-private-fs = { path = "../../../../../crates/octopus-private-fs" }
octopus-tool-door-runtime = { package = "octopus-process-session-tool-runtime", path = "../../../process_session/packages/octopus-process-session-tool-runtime" }
octopus-interfaces = { path = "../../../../../crates/octopus-interfaces" }
octopus-app-server-interface = { path = "../../../../interface/world_operator_chat/packages/octopus-app-server-interface" }
octopus-tool-handlers = { path = "../../../../../crates/octopus-tool-handlers" }
octopus-tool-registry = { path = "../../../../../crates/octopus-tool-registry" }
octopus-worker-env = { path = "../../../../../crates/octopus-worker-env" }


[dev-dependencies]
octopus-ledger = { path = "../../../../../crates/octopus-ledger" }
tempfile = "3"
tokio = { workspace = true, features = ["net", "macros", "rt-multi-thread"] }
