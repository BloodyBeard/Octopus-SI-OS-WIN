[package]
name = "octopus-audio-device-session-env"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
cpal = "0.16.0"
fs2 = "0.4"
rodio = { version = "0.21.1", default-features = false, features = ["playback", "wav", "mp3", "flac", "vorbis", "mp4"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

octopus-descriptors = { path = "../../../../../crates/octopus-descriptors" }
octopus-interfaces = { path = "../../../../../crates/octopus-interfaces" }
octopus-ledger = { path = "../../../../../crates/octopus-ledger" }
octopus-tool-door-runtime = { package = "octopus-process-session-tool-runtime", path = "../../../process_session/packages/octopus-process-session-tool-runtime" }
octopus-tool-handlers = { path = "../../../../../crates/octopus-tool-handlers" }
octopus-tool-registry = { path = "../../../../../crates/octopus-tool-registry" }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
