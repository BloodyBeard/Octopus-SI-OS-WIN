[package]
name = "octopus-system-coder-env"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
ignore = "0.4.23"
regex = "1.12.3"
similar = "2.7.0"
blake3 = { workspace = true }
base64 = "0.22.1"

octopus-descriptors = { path = "../../../../../crates/octopus-descriptors" }
octopus-tool-door-runtime = { package = "octopus-process-session-tool-runtime", path = "../../../process_session/packages/octopus-process-session-tool-runtime" }
tracing = "0.1.44"
octopus-interfaces = { path = "../../../../../crates/octopus-interfaces" }
octopus-git-sandbox = { package = "octopus-git-sandbox-substrate", path = "../octopus-git-sandbox-substrate" }
octopus-applypatch = { path = "../octopus-applypatch" }
octopus-file-search = { path = "../octopus-file-search" }
octopus-file-system = { path = "../../../process_session/packages/octopus-file-system" }
octopus-util-pathuri = { path = "../../../process_session/packages/octopus-util-pathuri" }
octopus-tool-handlers = { path = "../../../../../crates/octopus-tool-handlers" }
octopus-tool-registry = { path = "../../../../../crates/octopus-tool-registry" }
octopus-worker-env = { path = "../../../../../crates/octopus-worker-env" }

[dev-dependencies]
# The gate unit test builds a minimal invocation envelope; `ArtifactRef.content` is a `ContentHash`.
octopus-ledger = { path = "../../../../../crates/octopus-ledger" }
tempfile = "3"
