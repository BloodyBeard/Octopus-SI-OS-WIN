[package]
name = "octopus-code-mode-engine"
edition = "2024"
version.workspace = true
license.workspace = true
rust-version = "1.85"

[lib]
doctest = false
name = "octopus_code_mode_engine"
path = "src/lib.rs"

[features]
sandbox = ["v8/v8_enable_sandbox"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true

deno_core_icudata = "0.77.0"
tracing = "0.1.44"
v8 = "=149.2.0"

[dev-dependencies]
pretty_assertions = "1.4.1"
