[package]
name = "octopus-substrate-contract"
# BOX crate (crates/): the substrate contract carved out of octopus-protocol —
# sandbox posture, filesystem/network permissions, shell-environment policy,
# exec output, git sha, command parse. ZERO model-wire vocabulary, ZERO registry
# dependency. Genuine box crates (file-system, git-utils, shell-command,
# shell-escalation, sandbox) depend on THIS instead of reaching into the
# provider registry, so box depends on box (two-homes law).
#
# Ported Codex substrate uses let-chains -> requires edition 2024 (override
# workspace 2021), matching the sibling box crates (git-utils, shell-command,
# sandbox).
edition = "2024"
rust-version = "1.85"
version.workspace = true
license.workspace = true

[lib]
name = "octopus_substrate_contract"
path = "src/lib.rs"
doctest = false

[dependencies]
# Leaf/utility box crates only — never the provider registry.
octopus-util-abspath = { path = "../octopus-util-abspath" }
octopus-util-pathuri = { path = "../octopus-util-pathuri" }

serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
schemars = "0.8.22"
strum_macros = "0.28.0"
ts-rs = { version = "11", features = [
    "uuid-impl",
    "serde-json-impl",
    "no-serde-warnings",
] }
chardetng = "0.1.17"
encoding_rs = "0.8.35"
globset = "0.4"
wildmatch = "2.6.1"
tracing = "0.1"

[dev-dependencies]
pretty_assertions = "1.4.1"
tempfile = "3.23.0"
