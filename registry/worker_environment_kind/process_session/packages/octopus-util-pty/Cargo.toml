[package]
name = "octopus-util-pty"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
doctest = false

[dependencies]
# mandated boilerplate workspace deps
anyhow.workspace = true
tokio = { workspace = true, features = ["net"] }
# crates.io deps (versions/features from docs/references/codex/codex-rs/Cargo.toml)
portable-pty = "0.9.0"

[dev-dependencies]
pretty_assertions = "1.4.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2.182"

[target.'cfg(windows)'.dependencies]
filedescriptor = "0.8.3"
lazy_static = "1"
log = "0.4"
shared_library = "0.1.9"
winapi = { version = "0.3.9", features = [
    "handleapi",
    "jobapi",
    "jobapi2",
    "libloaderapi",
    "minwinbase",
    "processthreadsapi",
    # ConPTY code passes handles typed as std::ffi::c_void; "std" makes winapi's
    # c_void that same type instead of relying on another crate enabling it.
    "std",
    "synchapi",
    "winbase",
    "wincon",
    "winerror",
    "winnt",
] }
