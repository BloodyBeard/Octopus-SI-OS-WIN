[package]
name = "octopus-process-session-tool-runtime"
edition = "2024"
version.workspace = true
license.workspace = true
rust-version = "1.85"

[lib]
name = "octopus_process_session_tool_runtime"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "octopus-process-session-tool-door-life"
path = "src/bin/tool_door_life.rs"

[features]
owner-contract-tests = []

[dependencies]
blake3.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "io-std", "io-util", "time", "process"] }
tokio-util = { version = "0.7", features = ["rt"] }
notify.workspace = true
tracing = "0.1.44"
object = { version = "0.37.3", default-features = false, features = ["read", "std"] }
rusqlite = { version = "0.32", features = ["bundled"] }
octopus-descriptors = { path = "../../../../../crates/octopus-descriptors" }
octopus-file-storage = { path = "../../../../../crates/octopus-file-storage" }
octopus-interfaces = { path = "../../../../../crates/octopus-interfaces" }
octopus-ledger = { path = "../../../../../crates/octopus-ledger" }
octopus-tool-handlers = { path = "../../../../../crates/octopus-tool-handlers" }
octopus-tool-registry = { path = "../../../../../crates/octopus-tool-registry" }
octopus-worker-env = { path = "../../../../../crates/octopus-worker-env" }

[target.'cfg(unix)'.dependencies]
libc = "0.2.182"

[dev-dependencies]
tempfile = "3.23.0"
