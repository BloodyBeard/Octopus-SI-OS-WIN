[package]
name = "octopus-file-system"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
doctest = false

[dependencies]
bytes = "1.10.1"
futures = { version = "0.3", default-features = false }
octopus-substrate-contract = { path = "../octopus-substrate-contract" }
octopus-util-abspath = { path = "../octopus-util-abspath" }
octopus-util-pathuri = { path = "../octopus-util-pathuri" }
serde = { version = "1", features = ["derive"] }
tokio = { workspace = true, features = ["fs", "io-util", "rt"] }
tokio-util = { workspace = true, features = ["io"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.182"
rustix = { version = "1.1.4", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Kernel",
    "Win32_System_Pipes",
] }

[dev-dependencies]
tempfile = "3.23.0"
pretty_assertions = "1.4.1"

[target.'cfg(windows)'.dev-dependencies]
uuid = { version = "1", features = ["v4"] }
