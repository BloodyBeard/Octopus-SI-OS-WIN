name: windows

# Tracks the Windows port: type-checks the whole Rust workspace on a real
# Windows runner and lists every crate that does not compile yet.
on:
  push:
    paths-ignore:
      - "docs/**"
      - "README.md"
      # The temporary channel between the cloud and Windows port sessions.
      - "AI_comms.md"
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-check:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      # Some snapshot files have names that put their full path past Windows'
      # 260-character limit; without long paths, checkout cannot create them.
      - name: Allow long paths in git
        run: git config --system core.longpaths true
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install the pinned Windows Codex CLI
        shell: bash
        # Downloads codex.exe and its helpers, checks their pinned SHA-256, the
        # reported version and the app-server protocol schemas.
        run: node registry/interface/world_provider_codex/packages/octopus-provider-codex/managed-cli/bootstrap.cjs materialize --destination "$(cygpath -w "$PWD/registry/interface/world_provider_codex/packages/bin")"
      - name: cargo check (all targets)
        shell: bash
        run: |
          set -o pipefail
          cargo check --workspace --all-targets --keep-going --message-format short 2>&1 | tee check.log
      - name: Summarize failing crates
        if: always()
        shell: bash
        run: |
          {
            echo "## Windows cargo check"
            if grep -q "could not compile" check.log; then
              echo
              echo '```'
              grep "could not compile" check.log | sort -u
              echo '```'
            else
              echo
              echo "Every workspace crate type-checks on Windows."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
